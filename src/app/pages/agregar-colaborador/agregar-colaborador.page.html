<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>agregarColaborador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="foto">
    <ion-icon name="person-circle-outline"></ion-icon>
    <ion-icon name="camera" class="camara"></ion-icon>
  </div>

  <form (ngSubmit)="guardarColaborador()">

    <ion-label>Nombre</ion-label>
    <ion-input
      [(ngModel)]="nombre"
      name="nombre"
      placeholder="Nombre completo"
      required>
    </ion-input>

    <ion-label>Correo electrónico</ion-label>
    <ion-input
      [(ngModel)]="correo"
      name="correo"
      type="email"
      placeholder="correo@empresa.com"
      required>
    </ion-input>

    <ion-label>Teléfono</ion-label>
    <ion-input
      [(ngModel)]="telefono"
      name="telefono"
      type="tel"
      placeholder="+52 600 123 4567"
      required>
    </ion-input>

    <ion-label>Puesto</ion-label>
    <ion-select
      [(ngModel)]="puesto"
      name="puesto"
      placeholder="Selecciona un puesto"
      interface="popover"
      required>
      <ion-select-option value="Administrador">Administrador</ion-select-option>
      <ion-select-option value="Técnico">Técnico</ion-select-option>
      <ion-select-option value="Supervisor">Supervisor</ion-select-option>
      <ion-select-option value="Auxiliar">Auxiliar</ion-select-option>
    </ion-select>

    <ion-label>Departamento</ion-label>
    <ion-select
      [(ngModel)]="departamento"
      name="departamento"
      placeholder="Selecciona un departamento"
      interface="popover"
      required>
      <ion-select-option value="Sistemas">Sistemas</ion-select-option>
      <ion-select-option value="Recursos Humanos">Recursos Humanos</ion-select-option>
      <ion-select-option value="Administración">Administración</ion-select-option>
      <ion-select-option value="Soporte Técnico">Soporte Técnico</ion-select-option>
    </ion-select>

    <ion-label>Fecha de ingreso</ion-label>
    <ion-input
      [(ngModel)]="fechaIngreso"
      name="fechaIngreso"
      type="date"
      required>
    </ion-input>

    <ion-button expand="block" type="submit" class="guardar">
      Guardar
    </ion-button>

  </form>
</ion-content>
